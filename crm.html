<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CRM Reset Ultra</title>
<style>
/* Même mise en page que la feuille imprimée (demande Djibril 03/08 : « bien ordonné, un peu comme
   sur le PDF ») mais alimentée en direct. Fond clair volontairement : c'est un document qu'on lit
   longtemps et qu'on imprime, pas un tableau de bord qu'on consulte 10 secondes. */
@page{size:A4;margin:12mm}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;color:#111;background:#fff;padding:22px 16px 60px;max-width:960px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em}
.sous{color:#666;font-size:13px;margin:3px 0 16px}
h2{font-size:16px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid #111}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.k{flex:1;min-width:96px;border:1px solid #e2e2e2;border-radius:10px;padding:10px 12px}
.k b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.k span{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.06em}
.hero{border-color:#111;background:#f7f7f7}
table{width:100%;border-collapse:collapse;margin-top:4px}
td{padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top;font-size:14px}
.dt{white-space:nowrap;color:#555;width:88px;font-variant-numeric:tabular-nums;font-size:13px}
.nm{font-weight:600}
.st{color:#555;width:80px;font-size:12px}
.et{text-align:right;white-space:nowrap;width:104px}
.p{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.p.ok{background:#dcfce7;color:#15803d}.p.no{background:#fee2e2;color:#b91c1c}
.p.na{background:#f1f5f9;color:#64748b}.p.av{background:#e0e7ff;color:#3730a3}
.q{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700}
.nt{margin-top:6px;padding:7px 10px;background:#fafafa;border-left:2px solid #cbd5e1;font-weight:400;font-size:13px;color:#333;white-space:pre-wrap;border-radius:0 6px 6px 0}
.note{font-size:12.5px;color:#666;margin-top:10px;line-height:1.5}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 2px}
.bar button{background:#f1f1f1;border:0;color:#555;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.bar button.on{background:#111;color:#fff}
.maj{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e5e5;text-align:center;color:#888;font-size:12px;padding:8px}
.err{border:1px solid #fca5a5;background:#fef2f2;color:#991b1b;border-radius:10px;padding:14px;font-size:14px}
/* MOBILE : 4 colonnes fixes sur 375 px écrasaient la colonne des notes à un mot par ligne, donc la
   seule information vraiment utile devenait illisible. On repasse chaque ligne en bloc :
   [date | état] sur la première ligne, le nom et sa note en pleine largeur, le setter en dessous. */
@media(max-width:560px){
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:11px 0;border-bottom:1px solid #eee;align-items:baseline}
  td{display:block;border:0;padding:0}
  .dt{grid-column:1;grid-row:1;width:auto}
  .et{grid-column:2;grid-row:1;width:auto;text-align:right}
  .nm{grid-column:1/-1;grid-row:2}
  .st{grid-column:1/-1;grid-row:3;width:auto;font-size:11.5px;color:#777}
  .st:before{content:"setté par "}
  .nt{white-space:pre-wrap;word-break:break-word}
  .k{min-width:calc(50% - 4px)}
}
@media print{
  body{padding:0;max-width:none}
  .bar,.maj{display:none}
  .k{break-inside:avoid}tr{break-inside:avoid}h2{break-after:avoid}
}
.com{border:2px solid #111;border-radius:14px;padding:16px 18px;margin:16px 0 4px;background:#fafafa}
.com-l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#666}
.com-b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.com-d{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:#444;padding:4px 0;border-top:1px solid #e8e8e8}
.com-d b{font-variant-numeric:tabular-nums}
.cre{margin-top:6px;padding:6px 10px;background:#fff7ed;border-left:2px solid #fb923c;border-radius:0 6px 6px 0;font-size:13px;color:#9a3412;font-weight:600}
.com-d.fut{color:#777;font-style:italic}
.ech{font-weight:600;font-size:12.5px;margin-top:4px;color:#9a3412}
.ech i{font-weight:400;opacity:.75;font-style:normal}
</style>
</head>
<body>
<div id="app"><div class="sous">Chargement…</div></div>
<div class="maj" id="maj"></div>

<script>
var API  = "https://nbnbsljqtolzzuqnkyae.supabase.co/functions/v1/dashboard-api";
var qs   = new URLSearchParams(location.search);
var TOK  = qs.get("t") || "";
var ROLE = (qs.get("r") || "patron").toLowerCase();
var WHO  = qs.get("q") || "";
var app  = document.getElementById("app");
var DATA = null, FILTRE = "tous";

function esc(s){ return String(s==null?"":s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); }
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function frDate(iso){
  if (!iso) return "—";
  var d = new Date(iso);
  return new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"}).format(d).replace(",","");
}
function moisDe(iso){
  if (!iso) return "sans date";
  var d = new Date(iso);
  var p = new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",timeZone:"Europe/Paris"}).format(d).slice(0,7).split("-");
  return MOIS[(+p[1])-1] + " " + p[0];
}

// L'état d'une ligne. « non renseigné » ne s'affiche QUE sur un rendez-vous déjà passé : sur un
// rendez-vous à venir il n'y a rien à renseigner, et l'afficher ferait croire à un oubli.
function etatDe(l){
  if (l.montant > 0) return ["signé " + l.montant.toLocaleString("fr-FR") + " €", "ok"];
  if (l.etat === "venu")   return ["venu", "ok"];
  if (l.etat === "noshow") return ["pas venu", "no"];
  if (!l.passe)            return ["à venir", "av"];
  return ["non renseigné", "na"];
}

// Badge de PRIME par ligne (barème 08/08). Quand elle est due : le montant. Quand elle ne l'est
// pas sur un lead venu : la condition MANQUANTE, nommée — c'est ce qui rend le barème motivant,
// le setter voit exactement quoi améliorer (« vidéo pas vue » se travaille avant l'appel).
function badgePrime(l){
  // La source du statut converti, toujours dite : ✋ = corrigé à la main (certain), sinon la
  // déduction en toutes lettres (« a booké 2 j après son arrivée »). Un badge sans pourquoi ne se
  // vérifie pas, et un chiffre invérifiable ne sert pas à payer quelqu'un.
  if (l.prime > 0) {
    var src = l.converti ? ' · converti' + (l.conv_manuel ? ' ✋' : (l.conv_src ? ' (' + l.conv_src + ')' : '')) : '';
    return '<span class="q" style="background:#dcfce7;color:#15803d">prime ' + l.prime + ' €' + esc(src) + '</span>';
  }
  if (!l.passe || l.etat !== "venu") return '';
  if (!l.qualif) return '';
  if (!l.vsp) return '<span class="q" style="background:#f1f5f9;color:#64748b">vidéo pas vue → pas de prime</span>';
  return '';
}
function ligne(l){
  var e = etatDe(l);
  var nt = (l.notes || []).map(function(x){ return '<div class="nt">' + esc(x) + '</div>'; }).join("");
  // Créance : le reste dû sur le contrat. Affiché à côté de l'encaissé, jamais fondu dedans — sinon
  // on lirait comme « argent rentré » quelque chose qui n'est pas encore sur le compte.
  if (l.reste > 0) {
    var jj = function(x){ return x ? x.split("-").reverse().join("/") : ""; };
    var ech = (l.echeances || []).filter(function(e){ return e.cumul > l.montant; });
    var lignesEch = ech.length
      // Paliers CUMULÉS : on affiche ce qu'il reste à verser À CHAQUE palier, pas le cumul brut —
      // « encore 750 € le 15/08 » se comprend tout de suite, « 1 000 € cumulés » demande un calcul.
      ? ech.map(function(e, i){
          var precedent = i === 0 ? l.montant : ech[i-1].cumul;
          return '<div class="ech">→ ' + (e.cumul - precedent).toLocaleString("fr-FR") + ' € le ' + esc(jj(e.date))
               + ' <i>(pour atteindre ' + e.cumul.toLocaleString("fr-FR") + ' €)</i></div>';
        }).join("")
      : '<div class="ech">→ ' + l.reste.toLocaleString("fr-FR") + ' € ' + (l.echeance ? 'le ' + esc(jj(l.echeance)) : '(date non précisée)') + '</div>';
    nt = '<div class="cre">⏳ reste ' + l.reste.toLocaleString("fr-FR") + ' € sur ' + l.total.toLocaleString("fr-FR") + ' €'
       + lignesEch + '</div>' + nt;
  }
  return '<tr><td class="dt">' + esc(frDate(l.iso)) + '</td>'
       + '<td class="nm">' + esc(l.nom) + (l.qualif ? '<span class="q">bon profil</span>' : '') + badgePrime(l) + nt + '</td>'
       + '<td class="st">' + esc(l.setter || "—") + '</td>'
       + '<td class="et"><span class="p ' + e[1] + '">' + esc(e[0]) + '</span></td></tr>';
}

function tableau(L){
  if (!L.length) return '<div class="sous" style="padding:14px 0">Aucun rendez-vous dans ce filtre.</div>';
  // Regroupé par mois, comme la feuille imprimée : une liste de 150 lignes sans repère est illisible.
  var out = "", moisPrec = "";
  L.forEach(function(l){
    var m = moisDe(l.iso);
    if (m !== moisPrec) { if (out) out += '</table>'; out += '<h2>' + esc(m) + '</h2><table>'; moisPrec = m; }
    out += ligne(l);
  });
  return out + '</table>';
}

function filtrer(L){
  if (FILTRE === "venus")    return L.filter(function(l){ return l.etat === "venu"; });
  if (FILTRE === "absents")  return L.filter(function(l){ return l.etat === "noshow"; });
  if (FILTRE === "signes")   return L.filter(function(l){ return l.montant > 0; });
  if (FILTRE === "attente")  return L.filter(function(l){ return l.passe && !l.etat; });
  if (FILTRE === "avenir")   return L.filter(function(l){ return !l.passe; });
  return L;
}

function rendre(d){
  DATA = d;
  var L = filtrer(d.lignes || []);
  var f = [["tous","Tous ("+d.total+")"],["avenir","À venir ("+d.avenir+")"],["venus","Venus ("+d.venus+")"],
           ["absents","Pas venus ("+d.absents+")"],["attente","Non renseignés ("+d.non_notes+")"],["signes","Signés ("+d.signes+")"]];
  // VUE SETTER : sa commission d'abord, en gros. C'est la seule question qu'il se pose en ouvrant.
  // Formule Djibril 03/08 : 5 % du CA de chaque vente + 20 € par lead qualifié. Aucune marge, aucune
  // charge, aucun argent hors publicité : il peut la recalculer de tête le jour de la vente.
  var comm = d.setter ? (''
    + '<div class="com">'
    +   '<div class="com-l">Ta commission</div>'
    +   '<div class="com-b">' + d.commission.toLocaleString("fr-FR") + ' €</div>'
    +   '<div class="com-d">'
    +     '<span>' + d.pct + ' % de ' + d.ca.toLocaleString("fr-FR") + ' € de ventes</span><b>' + d.comm_ventes.toLocaleString("fr-FR") + ' €</b>'
    +   '</div>'
    +   '<div class="com-d">'
    +     '<span>' + d.prime_lead + ' € × ' + d.leads_abouti + ' lead' + (d.leads_abouti>1?'s':'') + ' abouti' + (d.leads_abouti>1?'s':'') + ' (venu + bon profil + vidéo vue)</span><b>' + (d.leads_abouti*d.prime_lead).toLocaleString("fr-FR") + ' €</b>'
    +   '</div>'
    +   '<div class="com-d">'
    +     '<span>' + (d.prime_lead+d.prime_convert) + ' € × ' + d.leads_converti + ' converti' + (d.leads_converti>1?'s':'') + ' (pris RDV grâce à ton appel)</span><b>' + (d.leads_converti*(d.prime_lead+d.prime_convert)).toLocaleString("fr-FR") + ' €</b>'
    +   '</div>'
    +   (d.reste_a_encaisser > 0
        ? '<div class="com-d fut"><span>À venir quand les soldes rentreront (' + d.reste_a_encaisser.toLocaleString("fr-FR") + ' €)</span><b>+ ' + d.comm_a_venir.toLocaleString("fr-FR") + ' €</b></div>'
        : '')
    + '</div>') : '';
  app.innerHTML =
      '<h1>' + (d.setter ? 'Mes rendez-vous' : 'CRM Reset Ultra') + '</h1>'
    + '<div class="sous">' + d.total + ' rendez-vous · ' + d.passes + ' passés, ' + d.avenir + ' à venir · mise à jour automatique</div>'
    + comm
    + '<div class="kpi">'
    +   '<div class="k hero"><b>' + (d.presence !== null ? d.presence.toFixed(0) + ' %' : '—') + '</b><span>Présence</span></div>'
    +   '<div class="k"><b>' + d.venus + '</b><span>Venus</span></div>'
    +   '<div class="k"><b>' + d.absents + '</b><span>Pas venus</span></div>'
    +   '<div class="k"><b>' + d.non_notes + '</b><span>Non renseignés</span></div>'
    +   '<div class="k"><b>' + d.signes + '</b><span>Signés</span></div>'
    +   '<div class="k"><b>' + d.ca.toLocaleString("fr-FR") + ' €</b><span>' + (d.setter ? 'Tes ventes' : 'Encaissé') + '</span></div>'
    + '</div>'
    + '<div class="note">La présence se calcule sur les ' + (d.venus + d.absents) + ' rendez-vous tranchés (venus + pas venus). '
    + 'Les ' + d.non_notes + ' non renseignés ne comptent dans aucun taux. Le repère « bon profil » n\'existe que depuis le 28 juillet : '
    + 'avant cette date, son absence ne veut pas dire que le profil était mauvais.</div>'
    + '<div class="bar">' + f.map(function(x){ return '<button data-f="' + x[0] + '"' + (FILTRE===x[0]?' class="on"':'') + '>' + x[1] + '</button>'; }).join("") + '</div>'
    + tableau(L);
  [].forEach.call(app.querySelectorAll(".bar button"), function(b){
    b.onclick = function(){ FILTRE = b.getAttribute("data-f"); rendre(DATA); };
  });
}

function charger(){
  if (!TOK) { app.innerHTML = '<div class="err">Lien incomplet. Redemande le lien d\'accès.</div>'; return; }
  fetch(API + "?r=" + encodeURIComponent(ROLE) + "&view=crm&t=" + encodeURIComponent(TOK)
        + (WHO ? "&q=" + encodeURIComponent(WHO) : ""), { cache: "no-store" })
    .then(function(r){
      if (r.status === 401) throw new Error("Lien invalide ou expiré.");
      if (!r.ok) throw new Error("Données momentanément indisponibles.");
      return r.json();
    })
    .then(function(d){
      if (d.error) throw new Error(d.message || "Données indisponibles.");
      rendre(d);
      document.getElementById("maj").textContent = "À jour · "
        + new Date(d.maj).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    })
    .catch(function(e){
      // On garde le tableau déjà affiché : effacer des données justes parce qu'un rafraîchissement a
      // échoué serait pire que de montrer des données d'il y a une minute. On le DIT, c'est tout.
      if (DATA) document.getElementById("maj").textContent = "⚠️ Mise à jour impossible, données de "
        + new Date(DATA.maj).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      else app.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
}

charger();
setInterval(charger, 45000);
// Retour sur l'onglet = rafraîchissement immédiat : après avoir cliqué sur Telegram, on veut voir
// le changement tout de suite, pas attendre le prochain cycle.
document.addEventListener("visibilitychange", function(){ if (!document.hidden) charger(); });
</script>
</body>
</html>
