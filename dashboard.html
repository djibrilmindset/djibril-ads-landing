<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tableau de bord</title>
<style>
/* Un écran = une question = un chiffre géant (SPEC_DASHBOARD.md). Mobile d'abord : tout tient
   sur un écran de téléphone en portrait, aucun réglage, aucun filtre de dates. */
:root{--bg:#0d0f12;--card:#16191f;--line:#242832;--txt:#f2f4f8;--dim:#8b93a3;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 14px 40px;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.hero{font-size:clamp(46px,15vw,68px);font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{margin-top:8px;font-size:15px;color:var(--dim)}
.up{color:var(--ok)}.down{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#000;border-radius:99px;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e)}
.big2{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
details{margin-top:2px}
summary{cursor:pointer;color:var(--acc);font-size:15px;padding:14px 0 4px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ›"}
details[open] summary::after{content:" ⌄"}
pre{font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt);white-space:pre-wrap;margin-top:12px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.5}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.t-ok{background:rgba(34,197,94,.16);color:#4ade80}
.t-no{background:rgba(239,68,68,.14);color:#f87171}
.t-w{background:rgba(245,158,11,.14);color:#fbbf24}
.t-n{background:#20242d;color:var(--dim)}
.lead{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.lead:last-child{border-bottom:0}
.lead .d{font-size:13px;color:var(--dim);margin-top:3px}
.maj{text-align:center;color:var(--dim);font-size:12px;margin-top:18px}
.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
h1{font-size:19px;font-weight:700;margin-bottom:14px}
.seg{display:flex;gap:6px;margin:14px 0 4px}
.seg button{flex:1;background:#20242d;border:0;color:var(--dim);padding:9px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.jour{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:14px 0 6px}
.jour:first-of-type{margin-top:4px}
.cr{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.cr-off{opacity:.45}
.cr-h{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;font-size:14px}
.cr-n{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{margin-top:7px;padding:8px 10px;background:#1b1f27;border-left:2px solid var(--acc);border-radius:0 8px 8px 0;font-size:13px;line-height:1.5;color:#cfd6e4}
.nt-q{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
.nt-v{border-left-color:var(--line);color:var(--dim);font-style:italic}
</style>
</head>
<body>
<div id="app"><div class="card"><div class="lbl">Chargement</div><div class="sub">Un instant…</div></div></div>
<div class="maj" id="maj"></div>

<script>
// ── Réglages ───────────────────────────────────────────────────────────────────────────────────
var API = "https://nbnbsljqtolzzuqnkyae.supabase.co/functions/v1/dashboard-api";
var qs  = new URLSearchParams(location.search);
var ROLE = (qs.get("r") || "").toLowerCase();
var TOK  = qs.get("t") || "";
var WHO  = qs.get("q") || "";
var app  = document.getElementById("app");

function eur(n){ return (Math.round(n||0)).toLocaleString("fr-FR") + " €"; }
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function nomMois(ym){ var p = String(ym||"").split("-"); return (MOIS[(+p[1]||1)-1]||"") + (p[0] != String(new Date().getFullYear()) ? " " + p[0] : ""); }
// Un mois qui vient de commencer affiche forcément une perte (charges déjà là, ventes pas encore) et
// une chute « vs mois dernier » absurde. On dit où on en est, et on tait les comparaisons trop tôt.
function jourDuMois(ym){
  var now = new Date(), ymNow = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  return ym === ymNow ? now.getDate() : 99;
}
function esc(s){ return String(s==null?"":s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }
function card(html, cls){ return '<div class="card'+(cls?" "+cls:"")+'">'+html+'</div>'; }
function moisPrec(ym){ var p = ym.split("-").map(Number); return p[1] === 1 ? (p[0]-1)+"-12" : p[0]+"-"+String(p[1]-1).padStart(2,"0"); }
function barreMois(d){
  var j = jourDuMois(d.mois), autre = MOIS_VUE ? "" : moisPrec(d.mois);
  return '<div class="seg" style="margin:0 0 12px">'
    + '<button class="'+(MOIS_VUE?"":"on")+'" onclick="voirMois(null)">Mois en cours</button>'
    + '<button class="'+(MOIS_VUE?"on":"")+'" onclick="voirMois(\''+moisPrec(new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0"))+'\')">Mois dernier</button></div>'
    + (j <= 7 && !MOIS_VUE ? '<div class="note" style="margin:-4px 0 12px">📅 '+nomMois(d.mois)+' vient de commencer (jour '+j+'). Les charges du mois sont déjà comptées, les ventes arrivent : c\'est normal que le chiffre soit bas ou négatif au début.</div>' : '');
}

function erreur(msg){
  app.innerHTML = card('<div class="lbl">Indisponible</div><div class="sub">'+esc(msg)+'</div>', "err");
}

// ── Écran SETTER : ce que j'ai gagné, mes appels, mon bilan ───────────────────────────────────
// REFONTE 02/08 (Djibril : « c'est pas intuitif, c'est moche, simplifie, fais plus concret »).
// L'écran empilait SIX blocs dont TROIS listes des mêmes rendez-vous. Il en reste trois, dans
// l'ordre des questions que le setter se pose vraiment :
//   1. combien j'ai gagné      2. qu'est-ce que j'ai à faire / qu'est-ce que ça a donné      3. où j'en suis
var ONGLET = "avenir";
function vueSetter(d){
  var h = barreMois(d);

  // ── 1. L'ARGENT ────────────────────────────────────────────────────────────────────────────
  var c = d.commission;
  if (c === null || c === undefined) {
    h += card('<div class="lbl">Ce que tu as gagné — '+nomMois(d.mois)+'</div>'
      + (d.assiette > 0
        ? '<div class="big2">En attente du coût de la pub</div><div class="note">Tes ventes sont comptées ('
          + eur(d.assiette)+' encaissés sur tes rendez-vous), mais la dépense publicitaire du mois n\'est pas '
          + 'encore connue. Sans elle le montant serait faux, donc il ne s\'affiche pas.</div>'
        : '<div class="hero">0 €</div><div class="sub">aucune vente encore signée sur tes rendez-vous ce mois-ci</div>'));
  } else {
    var dl = (d.commission_prev !== null && d.commission_prev !== undefined && jourDuMois(d.mois) > 10)
      ? (c - d.commission_prev) : null;
    h += card('<div class="lbl">Ce que tu as gagné — '+nomMois(d.mois)+'</div>'
      + '<div class="hero">'+eur(c)+'</div>'
      + '<div class="sub">sur '+eur(d.assiette)+' de ventes que tu as settées</div>'
      + (dl !== null ? '<div class="sub '+(dl>=0?"up":"down")+'">'+(dl>=0?"↑ +":"↓ ")+eur(Math.abs(dl))+' vs le mois dernier</div>' : '')
      + (c === 0 && d.assiette === 0 ? '' : '')
      + '<details><summary>Comment c\'est calculé</summary><pre>'
      + 'Ventes signées sur TES rendez-vous   ' + eur(d.assiette) + '\n'
      + '× ce qui reste après pub et frais    ' + (d.marge !== null ? d.marge.toFixed(1)+' %' : '—') + '\n'
      + '× ta part                            ' + d.pct + ' %\n'
      + '──────────────────────────────────────────\n'
      + '= ta commission                      ' + eur(c) + '</pre>'
      + '<div class="note">Ta part se calcule sur ce qui reste une fois la publicité, les abonnements et '
      + 'les frais payés. Seules les ventes issues de TES rendez-vous comptent.</div></details>');
  }

  // ── 2. UNE SEULE LISTE D'APPELS ────────────────────────────────────────────────────────────
  var A = d.appels || [];
  var now = Date.now();
  var futur = A.filter(function(x){ return Date.parse(x.iso) >= now; }).sort(function(a,b){ return Date.parse(a.iso)-Date.parse(b.iso); });
  var passe = A.filter(function(x){ return Date.parse(x.iso) <  now; });
  // Sur un mois PASSÉ, « à venir » n'a aucun sens : les appels futurs appartiennent au mois en cours.
  // Les afficher là ferait croire à un mois qui continue, et mélangerait deux périodes dans un écran
  // censé répondre à « qu'est-ce que j'ai fait en juillet ».
  var moisPasse = !!MOIS_VUE;
  if (moisPasse) { futur = []; ONGLET = "passe"; }
  h += card('<div class="lbl">Tes appels — '+nomMois(d.mois)+'</div>'
    + (moisPasse ? '' :
       '<div class="seg"><button id="tab-a" onclick="onglet(\'avenir\')">À venir ('+futur.length+')</button>'
       + '<button id="tab-p" onclick="onglet(\'passe\')">Passés ('+passe.length+')</button></div>')
    + '<div id="appels"></div>');

  // ── 3. SON BILAN ───────────────────────────────────────────────────────────────────────────
  var b = d.bilan;
  if (b && b.rdv > 0) {
    h += card('<div class="lbl">Où tu en es — '+nomMois(d.mois)+'</div>'
      + (b.presence !== null ? '<div class="row"><span>Ils viennent à l\'appel</span><b>'+b.presence.toFixed(0)+' %</b></div>' : '')
      + (b.qualif !== null ? '<div class="row"><span>Bons profils parmi les venus</span><b>'+b.qualif.toFixed(0)+' %</b></div>' : '')
      + (b.closing !== null ? '<div class="row"><span>Signent parmi les venus</span><b>'+b.closing.toFixed(0)+' %</b></div>' : '')
      + '<div class="row"><span>Fiches que tu as annotées</span><b>'+b.notes_ecrites+' / '+b.rdv+'</b></div>'
      + (b.sans_reponse > 0 ? '<div class="note">'+b.sans_reponse+' appel'+(b.sans_reponse>1?'s':'')
          +' sans réponse venu / pas venu : tes taux ne les comptent pas encore, ils bougeront.</div>' : ''));
  }
  app.innerHTML = h;
  APPELS = { avenir: futur, passe: passe };
  dessineAppels();
}

var APPELS = { avenir: [], passe: [] };
function onglet(k){ ONGLET = k; dessineAppels(); }
function dessineAppels(){
  var z = document.getElementById("appels"); if (!z) return;
  var ta = document.getElementById("tab-a"), tp = document.getElementById("tab-p");
  if (ta) ta.className = ONGLET === "avenir" ? "on" : "";
  if (tp) tp.className = ONGLET === "passe" ? "on" : "";
  var L = APPELS[ONGLET] || [];
  if (!L.length) {
    z.innerHTML = '<div class="sub" style="padding:14px 0">'
      + (ONGLET === "avenir" ? "Aucun appel à venir pour l\'instant." : "Aucun appel passé ce mois-ci.") + '</div>';
    return;
  }
  var jourPrec = "";
  z.innerHTML = L.map(function(l){
    var k = cleJour(l.iso), entete = "";
    if (k !== jourPrec) { jourPrec = k; entete = '<div class="jour">'+esc(libelleJour(k))+'</div>'; }
    // « réponse attendue » n'a de sens que sur un appel DÉJÀ PASSÉ : sur un appel de demain, ça
    // laissait croire qu'on attendait quelque chose du setter alors qu'il n'y a rien à faire.
    var futurL = Date.parse(l.iso) >= Date.now();
    var et = l.etat === "vendu"  ? '<span class="tag t-ok">signé '+eur(l.montant)+'</span>'
           : l.etat === "venu"   ? '<span class="tag t-w">venu</span>'
           : l.etat === "absent" ? '<span class="tag t-no">pas venu</span>'
           : futurL              ? '<span class="tag t-n">à venir</span>'
           : '<span class="tag t-w">réponse attendue</span>';
    var q = l.qualifie ? '<span class="tag t-ok">bon profil</span>' : '';
    var n = (l.notes || []).map(function(x){
      var m = String(x).match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
      return '<div class="nt">' + (m ? '<span class="nt-q">'+esc(m[1])+'</span>' : '')
           + esc(m ? m[2] : String(x)).replace(/\n/g, "<br>") + '</div>';
    }).join("");
    return entete + '<div class="lead"><span class="cr-h">'+esc(heureFr(l.iso))+'</span> <span>'+esc(l.nom)+'</span>'+et+q
      + (n ? '<details><summary>Ta note</summary>'+n+'</details>'
           : '<div class="d">Aucune note écrite</div>') + '</div>';
  }).join("");
}

// ── AGENDA 7 JOURS (demande Djibril 02/08) ────────────────────────────────────────────────────
// Lecture seule, alimenté par le vrai Google Agenda. Pour le setter : aucun montant, et les créneaux
// personnels de Djibril restent « Occupé » sans libellé. Rendu null par l'API = agenda injoignable :
// on le DIT, au lieu d'afficher un calendrier vide qui ferait croire à une semaine libre.
var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function heureFr(iso){
  return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"});
}
function cleJour(iso){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));
}
function libelleJour(ymd){
  var p = ymd.split("-").map(Number), d = new Date(Date.UTC(p[0],p[1]-1,p[2],12));
  var auj = cleJour(new Date().toISOString());
  var dem = cleJour(new Date(Date.now()+86400000).toISOString());
  if (ymd === auj) return "Aujourd'hui";
  if (ymd === dem) return "Demain";
  return JOURS[d.getUTCDay()] + " " + p[2];
}
function carteAgenda(d){
  if (d.agenda === null || d.agenda === undefined) {
    return card('<div class="lbl">Les 7 prochains jours</div>'
      + '<div class="note">Agenda momentanément injoignable. Il revient tout seul, mais ne considère pas la semaine comme libre en attendant.</div>');
  }
  if (!d.agenda.length) {
    return card('<div class="lbl">Les 7 prochains jours</div><div class="sub">Aucun rendez-vous prévu</div>');
  }
  var parJour = {}, ordre = [];
  d.agenda.forEach(function(e){
    var k = cleJour(e.iso);
    if (!parJour[k]) { parJour[k] = []; ordre.push(k); }
    parJour[k].push(e);
  });
  var h = '<div class="lbl">Les 7 prochains jours</div>';
  ordre.forEach(function(k){
    h += '<div class="jour">' + esc(libelleJour(k)) + '</div>';
    parJour[k].forEach(function(e){
      var badge = e.lead
        ? (e.moi === true ? '<span class="tag t-ok">tu l\'as setté</span>'
           : (e.setter ? '<span class="tag t-n">' + esc(e.setter) + '</span>' : ''))
        : '<span class="tag t-n">perso</span>';
      h += '<div class="cr' + (e.lead ? '' : ' cr-off') + '">'
        + '<span class="cr-h">' + (e.journee ? "journée" : esc(heureFr(e.iso))) + '</span>'
        + '<span class="cr-n">' + esc(e.nom) + '</span>' + badge + '</div>';
    });
  });
  return card(h);
}

// ── FICHE LEAD AVEC SES NOTES (demande Djibril 02/08) ─────────────────────────────────────────
// « qu'il puisse voir les différentes notes qu'il écrit sur chaque lead et qu'il va s'attacher à
// leur carte, pour savoir quel lead a no-show, a été présent, afin qu'il puisse se faire un
// feedback sur lui-même et que nous on ait une traçabilité de ce qui a été fait et du résultat ».
// La note et le RÉSULTAT sont volontairement collés : c'est en relisant « lead qualifié, prêt à
// s'investir » à côté de « pas venu » qu'on apprend quelque chose. Séparés, ils n'apprennent rien.
function ficheLeads(L, avecMontant){
  return L.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).map(function(l){
    var t = (avecMontant && l.montant > 0) ? '<span class="tag t-ok">vendu '+eur(l.montant)+'</span>'
          : l.venu ? '<span class="tag t-w">venu</span>'
          : l.noshow ? '<span class="tag t-no">pas venu</span>'
          : '<span class="tag t-n">à venir</span>';
    var q = l.qualifie ? '<span class="tag t-ok">bon profil</span>' : '';
    var n = (l.notes || []).map(function(x){
      // Le texte porte déjà son préfixe [Prénom JJ/MM HH:MM] : on le met en tête de note, en gris.
      var m = String(x).match(/^\[([^\]]+)\]\s*([\s\S]*)$/);
      var qui = m ? m[1] : "", txt = m ? m[2] : String(x);
      return '<div class="nt">' + (qui ? '<span class="nt-q">'+esc(qui)+'</span>' : '')
           + esc(txt).replace(/\n/g, "<br>") + '</div>';
    }).join("");
    return '<div class="lead"><span>'+esc(l.nom)+'</span>'+t+q
      + '<div class="d">'+esc(l.date)+(l.setter?' · setté par '+esc(l.setter):'')+'</div>'
      + (n || '<div class="nt nt-v">Aucune note écrite sur ce lead</div>') + '</div>';
  }).join("");
}

// ── Écran PATRON : décider ────────────────────────────────────────────────────────────────────
var DATA = null, FILTRE = "tous";
function vuePatron(d){
  DATA = d;
  var h = "";
  // 1. Bénéfice en géant ; le hors-pub reste à côté, jamais fondu dedans (sinon le rendement pub ment)
  var dl = (d.benefice_prev !== null && d.benefice_prev !== undefined && jourDuMois(d.mois) > 10) ? (d.benefice - d.benefice_prev) : null;
  h += barreMois(d);
  // 0. LE BRUT (demande Djibril 02/08 : « je veux savoir en brut combien j'ai fait »). Il ne dépend
  // d'AUCUNE charge — donc il s'affiche même quand Meta est muet et que le bénéfice reste masqué.
  // C'est le seul chiffre du tableau qui ne peut pas être faux : c'est de l'argent réellement entré.
  h += card('<div class="lbl">Brut encaissé — '+nomMois(d.mois)+'</div><div class="hero">'+eur(d.total)+'</div>'
    + '<div class="sub">avant publicité, abonnements et frais</div>'
    + '<div class="row"><span>Venu de la publicité</span><b>'+eur(d.ca)+'</b></div>'
    + '<div class="row"><span>Hors publicité</span><b>'+eur(d.hors_pubs)+'</b></div>');
  // Pub inconnue = on n'affiche AUCUN bénéfice (audit 01/08) : un chiffre calculé sans la dépense
  // publicitaire serait faux et servirait de base à la commission du setter.
  h += (d.benefice === null
    ? card('<div class="lbl">Ton bénéfice — '+nomMois(d.mois)+'</div><div class="big2">Dépense pub inconnue</div>'
      + '<div class="note">Meta n\'a pas répondu et aucun montant n\'a été saisi pour ce mois. Le bénéfice reste masqué : sans la publicité, il serait faux. Envoie <b>/pub 1500</b> sur Telegram pour débloquer. Le brut ci-dessus, lui, reste juste.</div>')
    : card('<div class="lbl">Ton bénéfice — '+nomMois(d.mois)+'</div><div class="hero">'+eur(d.benefice)+'</div>'
    + '<div class="sub">ce qui reste une fois la pub, les abonnements et les frais payés</div>'
    + (dl !== null ? '<div class="sub '+(dl>=0?"up":"down")+'">'+(dl>=0?"↑ +":"↓ ")+eur(Math.abs(dl))+' vs le mois dernier</div>' : '')
    // Ce bénéfice ne couvre QUE le périmètre pub : c'est voulu, la marge qui en découle sert à calculer
    // la part du setter, qui ne doit rien toucher sur une vente qu'il n'a pas settée. Mais Djibril garde
    // aussi les ventes hors pub — sans cette ligne, son bénéfice réel paraît plus bas qu'il n'est.
    + (d.hors_pubs > 0 ? '<div class="row" style="margin-top:10px"><span>Gardé au total, hors pub compris</span><b>'+eur(d.benefice + d.hors_pubs)+'</b></div>' : '')));
  // 2. La publicité, racontée en phrases + une ligne de décision
  var dec = "", cls = "";
  // Un mois de 2 jours a forcément un rendement écrasé (la pub est dépensée tous les jours, les ventes
  // arrivent après le cycle de closing) : conseiller « coupe tes créas » là-dessus, c'est pousser à
  // couper une campagne qui marche. Aucune décision publicitaire avant le 8.
  if (jourDuMois(d.mois) <= 7) { dec = "Trop tôt pour juger la publicité ce mois-ci : attends quelques jours de ventes."; cls = "t-n"; }
  else if (d.rendement === null) { dec = "Dépense publicitaire inconnue ce mois."; cls = "t-n"; }
  else if (d.rendement < 2.5) { dec = "Rendement faible : coupe ou revois les créas avant d'ajouter du budget."; cls = "t-no"; }
  else if (d.presence !== null && d.presence < 70) { dec = "Rendement bon, mais trop d'absents : traite la présence avant de monter le budget."; cls = "t-w"; }
  else { dec = "Tu peux monter le budget publicitaire."; cls = "t-ok"; }
  h += card('<div class="lbl">Ta publicité</div>'
    + (d.rendement !== null ? '<div class="big2">1 € dépensé → '+d.rendement.toFixed(2)+' € encaissés</div>' : '<div class="big2">—</div>')
    + '<div class="row"><span>Dépensé ce mois</span><b>'+eur(d.pub)+(d.pub_source==="meta"?' <span class="tag t-ok">Meta en direct</span>':' <span class="tag t-w">saisi à la main</span>')+'</b></div>'
    + (d.cout_client !== null ? '<div class="row"><span>Coût d\'un client</span><b>'+eur(d.cout_client)+'</b></div>' : '')
    + '<div class="note"><span class="tag '+cls+'">'+esc(dec)+'</span></div>');
  // 3. Les deux taux qui pilotent tout le reste
  // Même garde que le bénéfice (jour > 10) : au 2 du mois, 16 RDV encore sans réponse donnaient
  // « présence 0 % ↓46 pts » — une chute inventée par le calendrier, pas par le business.
  var pd = (d.presence_prev !== null && d.presence !== null && jourDuMois(d.mois) > 10) ? (d.presence - d.presence_prev) : null;
  h += card('<div class="lbl">Tes rendez-vous</div>'
    + '<div class="row"><span>Présence aux appels</span><b>'+(d.presence!==null?d.presence.toFixed(0)+" %":"—")
      + (pd !== null && Math.abs(pd) >= 1 ? ' <span class="'+(pd>=0?"up":"down")+'" style="font-size:13px">'+(pd>=0?"↑":"↓")+Math.abs(pd).toFixed(0)+' pts</span>' : '') + '</b></div>'
    + '<div class="row"><span>Ventes sur les venus</span><b>'+(d.closing!==null?d.closing.toFixed(0)+" %":"—")+'</b></div>'
    + '<div class="row"><span>RDV du mois</span><b>'+d.rdv+'</b></div>'
    + (d.non_renseignes > 0 ? '<div class="note">⚠️ '+d.non_renseignes+' rendez-vous sans réponse venu / pas venu. Tant qu\'ils ne sont pas renseignés, ils ne comptent dans aucun taux.</div>' : ''));
  // 4. Ce qu'on doit aux setters
  var pl = (d.parts||[]).map(function(p){
    return '<div class="row"><span>'+esc(p.nom)+'<span class="tag t-n">'+eur(p.assiette)+' settés</span></span><b>'+(p.part!==null?eur(p.part):"—")+'</b></div>';
  }).join("");
  h += card('<div class="lbl">À verser aux setters</div>'+(pl||'<div class="sub">Personne pour l\'instant</div>'));
  // 5. Le détail, filtrable — la demande du 01/08 : croiser venu et « setté par qui »
  h += carteAgenda(d);
  h += card('<details><summary>Voir les '+d.rdv+' rendez-vous</summary>'
    + '<div class="seg" id="seg"></div><div id="liste"></div></details>');
  // 6. Le calcul complet
  h += card('<details><summary>Le calcul du mois</summary><pre>'
    + 'CA venu de la publicité      ' + eur(d.ca) + '\n'
    + '− publicité                  ' + eur(d.pub) + '\n'
    + '− abonnements                ' + eur(d.abos) + '\n'
    + '− frais d\'encaissement ' + d.frais_pct + ' %   ' + eur(d.frais) + '\n'
    + '──────────────────────────────────────\n'
    + '= bénéfice                   ' + (d.benefice === null ? 'en attente de la dépense pub' : eur(d.benefice) + (d.marge !== null ? '   (' + d.marge.toFixed(1) + ' % de marge)' : '')) + '\n\n'
    + 'Hors publicité               ' + eur(d.hors_pubs) + '\n'
    + 'TOTAL ENCAISSÉ               ' + eur(d.total) + '</pre>'
    + '<div class="note">' + (d.subs||[]).map(function(s){ return esc(s.nom)+" "+eur(s.eur); }).join(" · ") + '</div></details>');
  app.innerHTML = h;
  dessineFiltres();
}

function dessineFiltres(){
  var seg = document.getElementById("seg"); if (!seg) return;
  var f = [["tous","Tous"],["venus","Venus"],["absents","Absents"],["gokhan","Settés Gokhan"]];
  seg.innerHTML = f.map(function(x){ return '<button data-f="'+x[0]+'"'+(FILTRE===x[0]?' class="on"':'')+'>'+x[1]+'</button>'; }).join("");
  Array.prototype.forEach.call(seg.querySelectorAll("button"), function(b){
    b.onclick = function(){ FILTRE = b.dataset.f; dessineFiltres(); };
  });
  var L = (DATA.lignes||[]).filter(function(l){
    if (FILTRE === "venus") return l.venu;
    if (FILTRE === "absents") return l.noshow;
    if (FILTRE === "gokhan") return l.setter === "Gokhan";
    return true;
  }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  // Même fiche que côté setter : Djibril lit EXACTEMENT ce que son setter a écrit sur chaque lead,
  // à côté du résultat. C'est la traçabilité qu'il a demandée : ce qui a été fait, et ce qui en découle.
  document.getElementById("liste").innerHTML = L.length
    ? ficheLeads(L, true)
    : '<div class="sub" style="padding:12px 0">Aucun rendez-vous dans ce filtre.</div>';
}

// ── Chargement + rafraîchissement automatique ─────────────────────────────────────────────────
var MOIS_VUE = null;
function voirMois(ym){ MOIS_VUE = ym; charger(); }
function charger(){
  if (!ROLE || !TOK) { erreur("Lien incomplet. Redemande ton lien d'accès."); return; }
  var u = API + "?r=" + encodeURIComponent(ROLE) + "&t=" + encodeURIComponent(TOK)
        + (WHO ? "&q=" + encodeURIComponent(WHO) : "")
        + (MOIS_VUE ? "&m=" + encodeURIComponent(MOIS_VUE) : "");
  fetch(u, { cache: "no-store" })
    .then(function(r){
      if (r.status === 401) throw new Error("Lien invalide ou expiré. Redemande-le à Djibril.");
      if (!r.ok) throw new Error("Chiffres momentanément indisponibles. Réessaie dans un instant.");
      return r.json();
    })
    .then(function(d){
      if (d.error) throw new Error(d.message || "Chiffres indisponibles.");
      document.title = d.role === "setter" ? "Ma commission" : "Mon business";
      (d.role === "setter" ? vueSetter : vuePatron)(d);
      document.getElementById("maj").textContent = "Mis à jour à l'instant · " +
        new Date(d.maj).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    })
    .catch(function(e){ erreur(e.message); });
}
charger();
// Rafraîchit tout seul quand l'écran revient au premier plan (le setter garde l'onglet ouvert).
document.addEventListener("visibilitychange", function(){ if (!document.hidden) charger(); });
setInterval(function(){ if (!document.hidden) charger(); }, 180000);
</script>
